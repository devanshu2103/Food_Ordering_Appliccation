{% extends "food/base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<body>
    {% block body %}
    {% for item in item_list %}
    
    <div class="row">
        <div class="col-md-3 offset-md-2">
            <img src="{{item.item_image}}" height="150px" class="card">

        </div>
        <div class="col-md-4">
            <h3>{{ item.item_name }}</h3>
            <h4>{{ item.item_disc }}</h4>
            <h5>{{ item.item_price }}</h5>

        </div>
        <div class="col-md-2">
            <a href="{% url 'food:detail' item.id %}" class="btn-success">Details</a>

        </div>
    </div>
    {% endfor %}
    {% endblock %}

</body>
</html>
